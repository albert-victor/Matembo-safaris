    <meta name="twitter:image" content="https://matembosafaris.com/assets/hero/_candidates/pexels-tanzania-elephant.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Great+Vibes&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preload" as="image" href="/assets/hero/_candidates/pexels-tanzania-elephant.jpg" fetchpriority="high" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/bcard-page.css" />
    <style>
      html.bcard-body,
      body.bcard-body,
      .bcard-cinema {
        background: #2a2218 url("/assets/hero/_candidates/pexels-tanzania-elephant.jpg") center 42% / cover no-repeat;
      }
    </style>
  </head>
  <body class="bcard-body">
    <div class="bcard-page">
      <div class="bcard-cinema bcard-cinema--ready" aria-hidden="true">
        <div class="bcard-cinema__slides" id="bcard-slideshow">
          <div class="bcard-cinema__slide is-active" data-kenburns="a">
            <div class="bcard-cinema__kenburns">
              <img
                src="/assets/hero/_candidates/pexels-tanzania-elephant.jpg"
                alt=""
                width="1920"
                height="1080"
                fetchpriority="high"
                decoding="sync"
                style="--bcard-focus: center 42%; --bcard-focus-mobile: center 38%"
              />
            </div>
          </div>
        </div>
        <div class="bcard-cinema__veil"></div>
        <div class="bcard-cinema__gold"></div>
        <div class="bcard-cinema__tint"></div>
        <div class="bcard-cinema__overlay"></div>
        <div class="bcard-cinema__vignette"></div>
      </div>
      <div class="bcard-stage">
        <main id="bcard-root" aria-label="Matembo Safari digital business card"></main>
      </div>
    </div>
    <script type="module" src="/src/js/bcard-main.js"></script>
  </body>
</html>
